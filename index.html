<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESG Intelligence</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap" rel="stylesheet">
<style>
/* ESG Intelligence: "working paper" design system.
   Fog paper, peat ink, spruce for evidence, ochre for "check this", madder for shortfalls.
   Archivo (narrow, heavy) for structure and numbers; Source Serif 4 for findings and prose. */
:root{
  --paper:#E9EDEA;--paper2:#E1E7E3;--sheet:#FAFBFA;--ink:#1E2A26;--ink2:#46534E;--ink3:#6F7D77;
  --rule:#CDD5D1;--rule2:#B4BFBA;--spruce:#1F5C4A;--spruce2:#174637;--spruce-bg:#DDEAE3;
  --ochre:#8F6418;--ochre-bg:#F1E6CF;--madder:#963040;--madder-bg:#F1DEE1;
  --sans:'Archivo',system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif;
  --r:6px;--ez:cubic-bezier(.2,.7,.2,1);
  /* aliases used by older inline styles */
  --bg:var(--paper);--s1:var(--sheet);--s2:var(--paper2);--tx:var(--ink);--ts:var(--ink2);--tm:var(--ink3);
  --bd:var(--rule);--bds:var(--rule2);--g:var(--spruce);--gb:var(--spruce);--gd:var(--spruce2);--am:var(--ochre);--rd:var(--madder)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);font-variation-settings:"wdth" 100;
  font-feature-settings:"tnum" 1,"lnum" 1;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4{font-family:var(--sans);color:var(--ink);margin:0;line-height:1.1}
h1{font-size:clamp(40px,6.4vw,78px);font-weight:800;font-variation-settings:"wdth" 68;letter-spacing:-.01em;line-height:.98}
h2{font-size:24px;font-weight:750;font-variation-settings:"wdth" 82;margin:44px 0 6px}
h3{font-size:17px;font-weight:650;margin:0 0 8px}
p{margin:0 0 10px;max-width:72ch}
a{color:var(--spruce)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--spruce);outline-offset:2px}
.hide{display:none}
.muted{color:var(--ink3)}
.note{font-size:13.5px;color:var(--ink3);max-width:80ch}
.lede{font-family:var(--serif);font-size:17px;line-height:1.6;color:var(--ink2);max-width:68ch}
.k{font-size:13px;font-weight:600;color:var(--ink3);margin:0 0 6px;letter-spacing:.005em}
.num{font-variant-numeric:tabular-nums}

/* masthead */
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px clamp(16px,4vw,40px);padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--sheet);border-bottom:1px solid var(--rule)}
.logo{display:flex;align-items:center;gap:10px;font:800 19px var(--sans);font-variation-settings:"wdth" 72;letter-spacing:.01em;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.logo svg{width:22px;height:22px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:4px;color:var(--ink2);font-size:14.5px;font-weight:500}
nav button:hover{color:var(--ink);background:var(--paper)}
nav button.on{color:var(--ink);font-weight:650;box-shadow:inset 0 -2px 0 var(--ink)}
main{max-width:1180px;margin:0 auto;padding:36px clamp(16px,4vw,40px) 64px;min-height:70vh}
footer{border-top:1px solid var(--rule);background:var(--sheet);color:var(--ink3);font-size:13px;padding:22px clamp(16px,4vw,40px);display:flex;gap:8px 24px;justify-content:space-between;flex-wrap:wrap}
footer p{margin:0;max-width:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 14.5px var(--sans);padding:10px 18px;border-radius:var(--r);
  border:1px solid var(--ink);background:var(--sheet);color:var(--ink);transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn.primary{background:var(--spruce);border-color:var(--spruce);color:#fff}.btn.primary:hover{background:var(--spruce2);border-color:var(--spruce2)}
.btn.s{border-color:var(--rule2);background:transparent}.btn.s:hover{border-color:var(--ink);background:var(--sheet);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.55;cursor:wait}
.inp{padding:10px 12px;border-radius:var(--r);border:1px solid var(--rule2);background:var(--sheet);color:var(--ink);font:inherit;outline:none;min-height:42px}
.inp:focus{border-color:var(--spruce);box-shadow:0 0 0 3px var(--spruce-bg)}
.seg{display:flex;border:1px solid var(--rule2);border-radius:var(--r);overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:0 16px;color:var(--ink2);font-size:14px}.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink);color:var(--sheet);font-weight:600}
a.lnk{color:var(--spruce);cursor:pointer;font-size:13.5px;text-decoration:underline;text-decoration-color:var(--rule2);text-underline-offset:3px}
a.lnk:hover{text-decoration-color:var(--spruce)}

/* surfaces: one panel style, used only where content needs a boundary */
.card,.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px 22px}
.card p{color:var(--ink2);font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:14px}
section{margin-bottom:8px}
.big{font:800 34px var(--sans);font-variation-settings:"wdth" 70;letter-spacing:-.005em}

/* status labels: a coloured square, not a pill */
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.tag::before{content:"";width:9px;height:9px;border-radius:1px;background:currentColor;flex:none}
.Disclosed,.Found,.Strong,.High,.sev0,.pos{color:var(--spruce)}
.Inferred,.Requires,.Moderate,.Medium,.Limited,.sev1,.sev2,.warn{color:var(--ochre)}
.Not,.Low,.None,.sev3,.sev4,.neg{color:var(--madder)}
.sev4::before{box-shadow:0 0 0 2px var(--madder-bg)}
.mid{color:var(--ink2)}.muted.pos,.pos.muted{color:var(--ink3)}
.pos{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:650;white-space:nowrap}
.pos::before{content:"";width:9px;height:9px;border-radius:1px;background:currentColor}
.meter{height:6px;border-radius:1px;background:var(--paper2);overflow:hidden}
.meter div{height:100%;width:var(--w);background:var(--spruce)}
.meter.peer div{background:var(--rule2)}

/* tables */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule2);margin:34px 0 22px;flex-wrap:wrap;align-items:flex-end}
.tabs button{background:none;border:0;padding:10px 14px;color:var(--ink3);font-size:14.5px;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .btn{margin:0 0 8px;border:1px solid var(--rule2);color:var(--ink);padding:6px 12px}.tabs .btn:hover{border-color:var(--ink);color:var(--sheet)}
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
th{font-weight:650;font-size:13px;color:var(--ink2);text-align:left;background:var(--sheet);border-bottom:1px solid var(--rule2);position:sticky;top:0}
th,td{padding:11px 14px;vertical-align:top;text-align:left}
td{border-bottom:1px solid var(--rule)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#F3F6F4}
td.val{font-family:var(--serif);font-size:15.5px}
/* page references sit in a margin column, like an auditor's note */
td.src{border-left:1px dashed var(--rule2);white-space:nowrap;width:1%}
.pg{display:inline-block;font-weight:700;font-size:12.5px;color:var(--spruce);border:1px solid var(--spruce);border-radius:3px;padding:0 5px;line-height:18px;font-variation-settings:"wdth" 80}
td.src .pg{margin-bottom:4px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center;padding:28px 0 56px;border-bottom:1px solid var(--rule2)}
.hero p.sub{font-family:var(--serif);font-size:19px;line-height:1.6;color:var(--ink2);margin:22px 0 28px;max-width:56ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.slip{margin:0;background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r);box-shadow:0 1px 0 var(--rule),0 18px 40px -24px rgba(30,42,38,.35)}
.slip .sh{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink3)}
.slip .sh b{color:var(--ink);font-weight:650}
.slip .row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.slip .row:last-of-type{border-bottom:0}
.slip .t{font-size:13.5px;color:var(--ink3);font-weight:600}
.slip .v{font-family:var(--serif);font-size:21px;color:var(--ink)}
.slip .v.neg{color:var(--madder)}
.slip .mg{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:12.5px;color:var(--ink3);max-width:20ch;border-left:1px dashed var(--rule2);padding-left:14px}
.slip .mg .pg{display:inline-block;margin-bottom:4px}
.slip .tick{color:var(--spruce);font-weight:700}
.slip figcaption{padding:10px 18px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--rule);background:var(--paper)}
.offer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px;margin:40px 0 12px}
.offer div{border-top:2px solid var(--ink);padding-top:14px}
.offer p{font-family:var(--serif);color:var(--ink2);font-size:15.5px}
.how{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:s;margin-top:14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.how li{list-style:none;padding:16px 18px;border-left:1px solid var(--rule);counter-increment:s;margin:0;color:var(--ink2);font-size:14.5px}
.how li:first-child{border-left:0}
.how li::before{content:counter(s);display:block;font:800 26px var(--sans);font-variation-settings:"wdth" 70;color:var(--rule2);margin-bottom:6px}
.how b{display:block;color:var(--ink);margin-bottom:2px}

/* report header on the dashboard */
.rephead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--rule2)}
.rephead h1{font-size:clamp(32px,4.4vw,52px)}
.rephead .meta{color:var(--ink3);margin:8px 0 0}
.cov{text-align:right}
.cov b{display:block;font:800 64px/1 var(--sans);font-variation-settings:"wdth" 64}
.cov span{font-size:13.5px;color:var(--ink3)}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 28px;margin-top:20px}
.pl .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pl .ph b{font-weight:650}.pl .ph span{font-size:13.5px;color:var(--ink3)}
.pl .tag{margin-top:8px}

/* upload, pipeline, banners */
.drop{text-align:center;padding:44px 20px;border:1.5px dashed var(--rule2);border-radius:var(--r);background:var(--sheet);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.hv{border-color:var(--spruce);background:#F4F8F6}
.drop .up{width:34px;height:34px;stroke:var(--spruce);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.drop span{color:var(--ink3);font-size:14px}
.pipe{display:flex;flex-direction:column;max-width:460px;margin-top:14px}
.st{display:flex;gap:12px;align-items:center;padding:7px 0;color:var(--ink3);font-size:14.5px;position:relative}
.st i{width:11px;height:11px;border-radius:2px;border:1.5px solid var(--rule2);flex:none;background:var(--sheet);position:relative;z-index:1}
.st:not(:last-child)::after{content:"";position:absolute;left:5px;top:24px;bottom:-8px;width:1px;background:var(--rule2)}
.st.done{color:var(--ink)}.st.done i{background:var(--spruce);border-color:var(--spruce)}
.st.run{color:var(--ink);font-weight:650}.st.run i{border-color:var(--spruce);animation:blink 1s steps(2) infinite}
.st.err{color:var(--madder)}.st.err i{background:var(--madder);border-color:var(--madder)}
.bar{height:4px;background:var(--paper2);border-radius:1px;overflow:hidden;margin:12px 0}
.bar div{height:100%;width:0;background:var(--spruce);transition:width .4s var(--ez)}
.banner{background:var(--ochre-bg);color:#5E4210;border-left:3px solid var(--ochre);border-radius:2px;padding:10px 16px;font-size:14px;font-weight:550;margin-bottom:18px}
.banner.info{background:var(--spruce-bg);color:var(--spruce2);border-left-color:var(--spruce)}
.err{background:var(--madder-bg);color:#6E1F2C;border-left:3px solid var(--madder);border-radius:2px;padding:11px 16px;margin:14px 0;font-size:14.5px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(30,42,38,.42);animation:fade .2s both}
.modal .card{max-width:680px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 30px 70px -30px rgba(0,0,0,.45)}
blockquote{margin:8px 0 16px;padding:10px 16px;border-left:3px solid var(--spruce);background:var(--paper);font-family:var(--serif);font-size:15.5px;color:var(--ink2)}

/* company picker */
.colist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:14px;max-height:304px;overflow:auto;padding:2px}
.co{text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:9px 12px;transition:border-color .12s}
.co:hover,.co.on{border-color:var(--ink)}
.co b{display:block;font-size:14.5px;font-weight:600}.co span{font-size:12.5px;color:var(--ink3)}
.fgrid{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:13px;color:var(--ink2);margin:10px 0}
.fgrid i{color:var(--ink3);font-style:normal}
ul{padding-left:20px;margin:6px 0 0}li{margin:5px 0;color:var(--ink2)}
.grid .card ul li{font-family:var(--serif);font-size:15px}

/* peer benchmark */
.formrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.formrow label{font-weight:600;font-size:14px}
.formrow select{min-width:260px}
.peerlist{margin-bottom:22px}
.peerlist ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.peerlist li{margin:0;padding:12px 14px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.peerlist li:first-child{border-left:0}
.peerlist li b{color:var(--ink);font-size:14.5px}
.ps.running span{color:var(--spruce)}.ps.queued span{color:var(--ink3)}.ps.failed span{color:var(--madder)}
.brief{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:var(--r);padding:22px 26px 10px}
.brief h2{margin:0 0 10px}
.brief .lead{font-family:var(--serif);font-size:20px;line-height:1.55;color:var(--ink);max-width:70ch}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 40px;margin-top:18px}
.twocol h3{margin-top:12px}
ul.lag,ul.lead-list,ul.plain{list-style:none;padding:0}
ul.lag>li{border-top:1px solid var(--rule);padding:10px 0;margin:0}
.lh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lh b{color:var(--madder)}.lh span{font-size:13px;color:var(--ink3);white-space:nowrap}
ul.who{list-style:none;padding:0;margin:6px 0 0}
ul.who li{font-family:var(--serif);font-size:14.5px;margin:2px 0}
ul.lead-list li{border-top:1px solid var(--rule);padding:10px 0;margin:0;font-family:var(--serif)}
ul.lead-list li b{font-family:var(--sans);color:var(--spruce)}
ul.lead-list .note{display:block;font-family:var(--sans)}
ul.plain li{border-top:1px solid var(--rule);padding:8px 0;margin:0;font-size:14.5px}
.strips{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px 22px}
.strip{display:grid;grid-template-columns:180px 1fr 300px;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.strip:last-child{border-bottom:0}
.sl{display:flex;justify-content:space-between;gap:8px}.sl span{font:800 20px var(--sans);font-variation-settings:"wdth" 70}
.track{position:relative;height:28px;background:linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/25% 100%,linear-gradient(var(--rule2),var(--rule2)) 0 50%/100% 1px no-repeat}
.track i{position:absolute;top:50%;transform:translate(-50%,-50%)}
.track .dot{width:10px;height:10px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink3)}
.track .med{width:2px;height:22px;background:var(--ink3)}
.track .you{width:5px;height:28px;background:var(--ink);border-radius:1px}
.sr{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ink3)}
table.matrix{min-width:860px}
table.matrix td,table.matrix th{padding:8px 12px}
table.matrix td.num,table.matrix td:first-child{white-space:nowrap}
th.c,td.c{text-align:center}
th.you,td.you{background:#F1F5F3}
tr.grp td{background:var(--paper);font-weight:700;font-size:13px;color:var(--ink);padding:7px 12px;border-bottom:1px solid var(--rule2)}
.mk{display:inline-block;width:13px;height:13px;border-radius:2px;vertical-align:-2px;margin:0 3px}
.mk.disclosed{background:var(--spruce)}
.mk.partial{background:linear-gradient(135deg,var(--ochre) 50%,transparent 50%);border:1.5px solid var(--ochre)}
.mk.missing{border:1.5px solid var(--rule2)}
td.best{font-weight:750;color:var(--spruce)}
sup{font-size:10.5px;color:var(--ink3);margin-left:3px;font-weight:600}
details.panel{margin-top:22px}
details summary{cursor:pointer;font-weight:650}
details[open] summary{margin-bottom:10px}
.fw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-size:13.5px;margin:6px 0 14px}
.cmp b{font-variant-numeric:tabular-nums}
table.mini{min-width:0;font-size:13.5px}
table.mini td{padding:5px 0;border-bottom:1px solid var(--rule)}
table.mini td.num{text-align:right}
ol.qs{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px 22px 12px 44px}
ol.qs li{font-family:var(--serif);font-size:16px;padding:6px 0;color:var(--ink)}

/* splash + welcome */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--paper);transition:opacity .5s var(--ez),visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:56px;height:56px}
#splash .lf1{transform-origin:32px 38px;animation:leaf .9s var(--ez) both}#splash .lf2{transform-origin:32px 44px;animation:leaf .9s .18s var(--ez) both}
#splash .stem{stroke-dasharray:24;stroke-dashoffset:24;animation:stem .5s var(--ez) forwards}
#splash .nm{font:800 26px var(--sans);font-variation-settings:"wdth" 70;letter-spacing:.01em}
#splash .ld{width:200px;height:2px;background:var(--rule);overflow:hidden}#splash .ld div{height:100%;width:0;background:var(--ink);animation:load 1.5s var(--ez) forwards}
#splash .sm{color:var(--ink3);font-size:13.5px;min-height:20px}
.welcome{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(30,42,38,.45);animation:fade .25s both}
.welcome .card{max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:30px 32px;border-top:3px solid var(--ink);box-shadow:0 30px 80px -30px rgba(0,0,0,.5)}
.welcome .hello{font-size:14px;color:var(--ink3);margin:0 0 6px}
.welcome h2{font-size:clamp(30px,4.6vw,44px);font-weight:800;font-variation-settings:"wdth" 68;margin:0 0 12px}
.steps{list-style:none;padding:0;margin:22px 0;counter-reset:w}

/* ---------- State ---------- */
let S={view:'home',tab:'Environmental',res:null,stages:[],msg:'',prog:0,err:'',file:null,busy:false,sd:{busy:false,err:'',res:null},bm:null};

const coKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9&]+/g,' ').trim();
function coMatches(q){q=coKey(q);return CO.filter(c=>(coRegion==='All'||c.region===coRegion)&&(!q||[c.name,c.id,c.sector,...c.aliases].some(n=>coKey(n).includes(q))))}
function coListHTML(q){const l=coMatches(q);
  return l.length?l.map(c=>`<button class="co ${coPick&&coPick.id===c.id?'on':''}" onclick="pickCompany('${c.id}')"><b>${esc(c.name)}</b><span>${esc(c.sector)}, ${esc(c.region)}</span></button>`).join(''):'<p style="color:var(--tm);margin:6px 0">No supported company matches. Pick one from the list.</p>'}
function filterCompanies(){const el=$('#coList');el&&(el.innerHTML=coListHTML($('#companySearch').value))}
function setRegion(r){coRegion=r;render()}
function pickCompany(id){coPick=CO.find(c=>c.id===id)||null;searchResults=[];searchMeta=null;searchErr='';searchCompany()}
async function searchCompany(){
  if(!coPick){const q=coKey($('#companySearch')?.value),m=coMatches(q);
    coPick=m.find(c=>[c.name,c.id,...c.aliases].some(n=>coKey(n)===q))||(m.length===1?m[0]:null)}
  if(!coPick){searchErr='Pick a company from the list below.';render();return}
  searchBusy=true;searchResults=[];searchMeta=null;searchErr='';render();
  try{
    const response=await fetch(API+'/api/company-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company:coPick.id})});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.detail||'Company search failed.');
    searchResults=data.reports||[];searchMeta=data;
  }catch(e){searchErr=e.message==='Failed to fetch'?'Cannot reach the backend right now (it may be waking up — try again in a minute). You can still upload a PDF below.':(e.message||'Company search failed.')}
  finally{searchBusy=false;render()}}
function clearPick(){coPick=null;searchResults=[];searchMeta=null;searchErr='';render()}

async function analyseReportUrl(encodedUrl){
  const url=decodeURIComponent(encodedUrl);

  S.err='';
  S.busy=true;
  S.res=null;
  S.sd={busy:false,err:'',res:null};
  S.bm=null;
  S.file=null;
  S.prog=0;
  S.stages=[];
  S.msg='Downloading selected report...';
  render();

  try{
    const response=await fetch(API+'/api/analyse-url',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url,company_id:coPick?coPick.id:''})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.detail||'Could not analyse selected report.');
    }

    completedJobId=data.job_id;

    while(true){
      const r=await fetch(API+'/api/jobs/'+data.job_id);

      if(!r.ok){
        throw new Error('Lost track of the analysis job.');
      }

      const j=await r.json();

      if(j.status==='error'){
        throw new Error(j.error||'Analysis failed.');
      }

      S.stages=STAGES.map((_,k)=>
        k<j.stage?'done':k===j.stage?'run':''
      );

      S.msg=j.msg||'Analysing...';
      S.prog=j.progress||0;

      if(j.status==='done'){
        S.res=j.result;
        S.busy=false;
        S.tab='Environmental';
        render('page');
        return;
      }

      $('#pb')?paintPipe():render();
      await new Promise(r=>setTimeout(r,700));
    }

  }catch(e){
    S.busy=false;
    S.err=e.message||'Analysis failed.';
    S.stages=S.stages.map(x=>x==='run'?'err':x);
    render();
  }
}

const STAGES=['Document','Extraction','Retrieval','ESG Analysis','Validation','Gap Analysis','Final Insights'];
function go(v){S.view=v;window.scrollTo({top:0,behavior:'smooth'});render('page')}
function setTab(t){S.tab=t;render('tab')}
function gaps(f){
  return Object.entries(f).flatMap(([c,l])=>
    l.filter(x=>
      x.status==='Not found' ||
      x.confidence==='Low' ||
      x.metric_status==='Not available' ||
      x.metric_status==='Unclear'
    ).map(x=>({
      cat:c,
      topic:x.topic,
      type:x.gap_type||'',
      why:x.gap_reason ||
        (x.status==='Not found'
          ? 'Not identified in analysed document'
          : x.confidence==='Low'
            ? 'Supporting evidence requires further verification'
            : 'Metric not identified')
    }))
  );
}

/* ---------- Orchestrator: uploads to backend, polls real stage status ---------- */
let completedJobId = null;

function uploadFile(file){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',API+'/api/analyse');
  x.upload.onprogress=e=>{if(e.lengthComputable){S.prog=e.loaded/e.total;S.msg='Uploading...';const b=$('#pb');b&&(b.style.width=Math.round(S.prog*100)+'%');const m=$('#pmsg');m&&(m.textContent=S.msg)}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?ok(j):no({message:j.detail||'Upload failed.'})};
  x.onerror=()=>no({message:'Cannot reach the backend. Is it running, and on the address this page uses?'});
  const fd=new FormData();fd.append('file',file);x.send(fd)})}
function paintPipe(){const b=$('#pb');b&&(b.style.width=Math.round(S.prog*100)+'%');const m=$('#pmsg');m&&(m.textContent=S.msg);document.querySelectorAll('.st').forEach((el,i)=>el.className='st '+(S.stages[i]||''))}
async function runAnalysis(file){
  S.err='';S.busy=true;S.res=null;S.sd={busy:false,err:'',res:null};S.bm=null;S.file=file;S.prog=0;S.stages=[];S.msg='Uploading...';render();
  try{
    const {job_id}=await uploadFile(file);
completedJobId = job_id;
    while(true){const r=await fetch(API+'/api/jobs/'+job_id);if(!r.ok)throw{message:'Lost track of the analysis job.'};const j=await r.json();
      if(j.status==='error')throw{message:j.error};
      S.stages=STAGES.map((_,k)=>k<j.stage?'done':k===j.stage?'run':'');S.msg=j.msg;S.prog=j.progress||0;
      if(j.status==='done'){S.res=j.result;S.busy=false;S.tab='Environmental';render('page');return}
      $('#pb')?paintPipe():render();await new Promise(r=>setTimeout(r,700))}
  }catch(e){S.busy=false;S.err=e.message||'Analysis failed.';S.stages=S.stages.map(s=>s==='run'?'err':s);render()}}

/* ---------- Report export ---------- */
function reportMD(){const r=S.res,g=gaps(r.f);let m=`# ESG Analysis Report${r.demo?' (DEMO / SAMPLE – MOCK DATA)':''}\n\n**Company:** ${r.meta.company}\n**Report type:** ${r.meta.type}\n**Reporting period:** ${r.meta.year}\n**Pages analysed:** ${r.meta.pages}\n\n## Executive summary\n${(r.ins.highlights||[]).map(x=>'- '+x).join('\n')}\n\n## Extracted metrics\n`;
  for(const c in r.f){m+=`\n### ${c}\n| Topic | Value / disclosure | Year | Source | Confidence | Status |\n|---|---|---|---|---|---|\n`+r.f[c].map(x=>`| ${x.topic} | ${x.value||'Not identified in analysed document'} | ${x.year||'-'} | ${x.page?'Page '+x.page:'-'} | ${x.confidence||'-'} | ${x.status} |`).join('\n')+'\n'}
  m+=`\n## Insights\n`+[['Environmental','env'],['Social','social'],['Governance','gov'],['Potential risk areas','risks'],['Recommended further investigation','investigate']].map(([t,k])=>`### ${t}\n`+(r.ins[k]||[]).map(x=>'- '+x).join('\n')).join('\n\n');
  m+=`\n\n## Disclosure gaps\n`+g.map(x=>`- ${x.cat}: ${x.topic} – ${x.why}`).join('\n');
  m+=`\n\n## Source references\n`+Object.values(r.f).flat().filter(x=>x.page).map(x=>`- ${x.topic}, page ${x.page}: "${x.quote}"`).join('\n');
  m+=`\n\n## AI limitations\nAI-assisted prototype. Not an ESG rating, assurance opinion, investment recommendation or compliance determination. Extraction may miss or misread content (tables, scanned pages); verify all findings against the source document.\n`;return m}
async function exportReport(){
  if(!completedJobId){
    alert('No completed analysis is available.');
    return;
  }

  try{
    const response = await fetch(
      API + '/api/jobs/' + completedJobId + '/report'
    );

    if(!response.ok){
      const text = await response.text();
      throw new Error(text || 'Could not generate PDF report.');
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'ESG_Intelligence_Report.pdf';

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

  }catch(error){
    console.error('PDF download failed:', error);
    alert('PDF download failed: ' + (error.message || error));
  }
}

async function runSayDo(){const r=S.res;
  if(r.demo){S.sd={busy:false,err:'',res:DEMO_WATCH};render('tab');return}
  S.sd={busy:true,err:'',res:null};render('tab');
  try{S.sd.res=await fetchScan(r.meta.company,90,completedJobId)}catch(e){S.sd.err=e.message}
  S.sd.busy=false;render('tab')}
function sayDoV(r){const sd=S.sd,ok=r.meta.company&&r.meta.company!=='Not identified';
  if(!sd.res)return`<div class="card"><h3>Does the news match the report?</h3><p>Scans recent news about <b>${esc(r.meta.company)}</b> and lines up each controversy against what this report discloses on the related topics.</p><p style="margin-top:14px">${ok?`<button class="btn primary" onclick="runSayDo()" ${sd.busy?'disabled':''}>${sd.busy?'Scanning news...':'Run say-do check'}</button>`:'The company name was not identified in this report, so the news scan cannot run. Use Controversy Watch and enter the name.'}</p>${sd.err?`<div class="err">${esc(sd.err)}</div>`:''}</div>`;
  const x=sd.res,cls={'Disclosure gap':'sev3','Compare claims':'sev2','Not covered':'mid'};
  return`${riskCards(x)}<div class="tw"><table><thead><tr><th>Assessment</th><th>In the news</th><th>Severity</th><th>In the report</th><th>What to do</th></tr></thead><tbody>${x.say_do.map(d=>`<tr><td><span class="tag ${cls[d.flag]}">${esc(d.flag)}</span></td><td>${esc(d.headline)}<br><span style="color:var(--tm);font-size:12.5px">${esc(d.sub)}, ${esc(STAGE[d.stage]||d.stage)}</span></td><td>${sevTag(d.severity)}</td><td>${d.topics.length?d.topics.map(t=>`${esc(t.topic)}: <b>${esc(t.status)}</b>${t.page?` (p. ${esc(t.page)})`:''}`).join('<br>'):'—'}</td><td>${esc(d.note)}</td></tr>`).join('')||'<tr><td colspan=5>No ESG controversy headlines were found for this company in the last 90 days.</td></tr>'}</tbody></table></div>

function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;p<1&&requestAnimationFrame(f)})(t0)})}
function render(mode){const v=S.view,app=$('#app');
  $('#nav').innerHTML=[['Dashboard','home'],['Analysis','analysis'],['Controversy Watch','watch'],['Methodology','method'],['About','about']].map(([l,k])=>`<button class="${v===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+'<button onclick="showWelcome()">Guide</button>';
  app.className=mode==='page'?'a-page':mode==='tab'?'a-tab':'';
  app.innerHTML={home,analysis,watch,method,about}[v]();
  if(mode){app.querySelectorAll('.reveal,tbody tr').forEach((el,i)=>el.style.setProperty('--i',i));mode==='page'&&countUp()}
  bindDrop()}
function bindDrop(){const d=$('#drop'),fi=$('#fi');if(!d)return;
  const pick=f=>{if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){S.err='Only PDF files are supported.';render();return}runAnalysis(f)};
  fi.onchange=()=>pick(fi.files[0]);d.ondragover=e=>{e.preventDefault();d.classList.add('hv')};d.ondragleave=()=>d.classList.remove('hv');d.ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files[0])}}

  const who=l=>l.who.map(w=>`<li>${esc(shortName(w.name))}${w.value?`: ${esc(w.value)}`:''}${w.page?` <span class="pg">p.${esc(w.page)}</span>`:''}</li>`).join('');
  return`<section class="brief"><h2>Analyst brief</h2><p class="lead">${esc(b.headline)}</p>
  <div class="twocol"><div><h3>Where it lags</h3>${b.lagging.length?`<ul class="lag">${b.lagging.slice(0,6).map(l=>`<li><div class="lh"><b>${esc(l.topic)}</b><span>${pct(l.peer_rate)} of peers disclose</span></div><ul class="who">${who(l)}</ul></li>`).join('')}</ul>${b.lagging.length>6?`<p class="note">${b.lagging.length-6} more in the disclosure matrix below.</p>`:''}`:'<p class="note">No topic where most peers disclose and this report does not.</p>'}</div>
  <div><h3>Where it leads</h3>${b.leading.length?`<ul class="lead-list">${b.leading.map(l=>`<li><b>${esc(l.topic)}</b>: ${esc(l.value)} <span class="pg">p.${esc(l.page)}</span><span class="note">${l.peer_rate?`Only ${pct(l.peer_rate)} of peers disclose this.`:"No peer discloses this."}</span></li>`).join('')}</ul>`:'<p class="note">No topic that this report discloses and most peers do not.</p>'}
  <h3>Comparable metrics</h3>${b.kpi_notes.length?`<ul class="plain">${b.kpi_notes.map(n=>`<li>${esc(n.replace(/\s*\(fictional\)/g,''))}</li>`).join('')}</ul>`:'<p class="note">Not enough peers report comparable figures.</p>'}</div></div></section>`}
function pillarsV(x){const rows=['Overall','Environmental','Social','Governance'];
  return`<section><h2>Disclosure coverage against peers</h2><p class="note">Share of the pillar's topics disclosed with validated evidence. Dots are peers, the line is the peer median, the bar is this company.</p>
  <div class="strips">${rows.map(k=>{const p=x.pillars[k];return`<div class="strip"><div class="sl"><b>${k}</b><span>${p.target}%</span></div>
  <div class="track">${p.median!=null?`<i class="med" style="left:${p.median}%" title="Peer median ${p.median}%"></i>`:''}${p.peers.map(q=>`<i class="dot" style="left:${q.value}%" title="${esc(shortName(q.name))}: ${q.value}%"></i>`).join('')}<i class="you" style="left:${p.target}%" title="${esc(shortName(x.target.name))}: ${p.target}%"></i></div>
  <div class="sr"><span class="pos ${POS[p.position]}">${p.position}</span><span>Rank ${p.rank} of ${p.of}${p.best?`, best ${esc(shortName(p.best.name))} ${p.best.value}%`:''}</span></div></div>`}).join('')}</div></section>`}
function matrixV(x){const ps=x.peers;let cat='';
  const cell=(m,t)=>`<td class="c"><span class="mk ${m.mark}" title="${esc(t)}: ${MARK[m.mark]}${m.value?' – '+esc(m.value):''}${m.page?' (p.'+m.page+')':''}"></span></td>`;
  return`<section><h2>Disclosure matrix</h2><p class="note"><span class="mk disclosed"></span> disclosed with validated evidence <span class="mk partial"></span> mentioned, not validated <span class="mk missing"></span> not found. Hover a mark for the value and page.</p>
  <div class="tw"><table class="matrix"><thead><tr><th>Topic</th><th class="c you">${esc(shortName(x.target.name))}</th>${ps.map(p=>`<th class="c">${esc(shortName(p.name))}</th>`).join('')}<th class="c">Peers</th><th>Position</th><th>GRI</th></tr></thead><tbody>
  ${x.topics.map(t=>{const head=t.cat!==cat?(cat=t.cat,`<tr class="grp"><td colspan="${ps.length+5}">${t.cat}</td></tr>`):'';
   return head+`<tr><td>${esc(t.topic)}</td>${cell(t.target,shortName(x.target.name)).replace('class="c"','class="c you"')}${t.peers.map(m=>cell(m,shortName(m.name))).join('')}<td class="c num">${pct(t.peer_rate)}</td><td><span class="pos ${POS[t.position]}">${t.position}</span></td><td class="num">${esc(t.frameworks.GRI||'')}</td></tr>`}).join('')}
  </tbody></table></div></section>`}
function kpiV(x){if(!x.kpis.length)return'';const names=[x.target.name,...x.peers.map(p=>p.name)];
  const f=(v,u)=>v==null?'<span class="muted">–</span>':u==='%'?v+'%':u==='hours'?v+' h':v;
  return`<section><h2>Comparable metrics</h2><p class="note">Only metrics with units that compare across company sizes are ranked. Values are parsed from validated findings; check the cited page before quoting them.</p>
  <div class="tw"><table><thead><tr><th>Metric</th>${names.map((n,i)=>`<th class="c${i?'':' you'}">${esc(shortName(n))}</th>`).join('')}<th>Peer median</th></tr></thead><tbody>
  ${x.kpis.map(k=>`<tr><td>${esc(k.label)}<br><span class="note">${k.higher_is_better?'Higher':'Lower'} is better</span></td>${k.rows.map((r,i)=>`<td class="c num${i?'':' you'}${r.name===k.leader?' best':''}">${f(r.value,k.unit)}${r.rank?`<sup>#${r.rank}</sup>`:''}</td>`).join('')}<td class="num">${k.peer_median==null?'–':f(k.peer_median,k.unit)}</td></tr>`).join('')}
  </tbody></table></div></section>`}
function absV(x){const names=[x.target.name,...x.peers.map(p=>p.name)];
  return`<details class="panel"><summary>Absolute figures as reported (not ranked)</summary><p class="note">Absolute emissions, energy, water and waste depend on company size, so they are listed side by side rather than ranked.</p>
  <div class="tw"><table><thead><tr><th>Topic</th>${names.map((n,i)=>`<th${i?'':' class="you"'}>${esc(shortName(n))}</th>`).join('')}</tr></thead><tbody>
  ${x.absolute.map(a=>`<tr><td>${esc(a.topic)}</td>${a.rows.map((r,i)=>`<td${i?'':' class="you"'}>${r.value?esc(r.value):'<span class="muted">Not disclosed</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`}
function fwV(x){const name={GRI:'GRI Standards',BRSR:'SEBI BRSR',TCFD:'TCFD'};
  return`<section><h2>Framework alignment</h2><p class="note">Each topic is mapped to the GRI disclosure, BRSR principle and TCFD pillar it most closely answers. This is an indicative mapping for comparison, not an assurance of compliance.</p>
  <div class="fw">${Object.entries(x.frameworks).map(([k,f])=>`<div class="panel"><h3>${name[k]}</h3>
  <div class="cmp"><span>${esc(shortName(x.target.name))}</span><div class="meter"><div style="--w:${f.target}%"></div></div><b>${f.target}%</b>
  ${f.peer_avg!=null?`<span>Peer average</span><div class="meter peer"><div style="--w:${f.peer_avg}%"></div></div><b>${f.peer_avg}%</b>`:''}</div>
  <table class="mini"><tbody>${f.sections.map(s=>`<tr><td>${esc(s.ref)}</td><td class="num">${s.target} of ${s.total}</td></tr>`).join('')}</tbody></table>
  ${f.missing.length?`<p class="k">Not disclosed</p><p class="note">${f.missing.map(esc).join('; ')}</p>`:''}</div>`).join('')}</div></section>`}
function questionsV(x){const q=x.brief.questions;if(!q.length)return'';
  return`<section><h2>Questions to put to the company</h2><ol class="qs">${q.map(s=>`<li>${esc(s.replace(/\s*\(fictional\)/g,''))}</li>`).join('')}</ol></section>`}
function benchV(r){const b=r.demo?DEMO_BENCH:(S.bm&&S.bm.data);
  if(!b)return benchStart(r);const x=b.result,run=b.status!=='done';
  return`${b.demo?'<div class="banner">Demo benchmark: the company and all four peers are fictional, with synthetic data.</div>':''}
  ${run?`<div class="banner info">Peer analyses are running. The comparison below updates as each peer finishes.</div>`:''}
  ${S.bm&&S.bm.err?`<div class="err">${esc(S.bm.err)}</div>`:''}
  ${peerStrip(b)}${briefV(x)}${x.peers.length?pillarsV(x)+matrixV(x)+kpiV(x)+absV(x):''}${fwV(x)}${x.peers.length?questionsV(x):''}`}

/* ---------- Loading screen + welcome guide ---------- */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function showWelcome(){
  const steps=[['Find or upload a report','Go to <b>Analysis</b>. Pick a well-known company to find its official ESG, sustainability, BRSR or annual report, or drag in any report PDF.'],
    ['Watch the agent work','The pipeline extracts the text, retrieves passages for each ESG topic, asks the AI for metrics with exact quotes, and then checks every quote against the PDF.'],
    ['Review metrics, insights and gaps','Browse the Environmental, Social and Governance tabs. Click <b>View quote</b> to see the page a figure came from, and use <b>Gaps</b> to see what the report leaves out.'],
    ['Benchmark and check the news','Open <b>Peer benchmark</b> to see where the company lags its industry and which peers do better, then <b>Say–Do check</b> to compare the report with news coverage.']];
  $('#welcome').innerHTML=`<div class="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle"><div class="card">
  <p class="hello">${greeting()}</p><h2 id="wTitle">Welcome to ESG Intelligence</h2>
  <p style="color:var(--ts);font-size:15.5px">An AI agent that reads company sustainability reports, checks its own work against the source, and compares the report with news coverage. Here's how to use it:</p>
  <ol class="steps">${steps.map(x=>`<li class="step"><div><h3>${x[0]}</h3><p>${x[1]}</p></div></li>`).join('')}</ol>
  <p style="font-size:12.5px;color:var(--tm);margin-bottom:18px">No account needed. The first live request can take up to a minute while the server wakes up. The demo works instantly.</p>
  <div class="wfoot"><button class="btn primary" onclick="closeWelcome('analysis')">Start analysing</button><button class="btn" onclick="closeWelcome('demo')">Try the demo</button><button class="btn s" onclick="closeWelcome()">Explore on my own</button>
  <label><input type="checkbox" id="wHide" ${store.get('esg-welcome-hide')?'checked':''}> Don't show again</label></div></div></div>`;
  setTimeout(()=>{const b=document.querySelector('.welcome .btn.primary');b&&b.focus()},50)}
function closeWelcome(next){const c=$('#wHide');
  if(c){if(c.checked)store.set('esg-welcome-hide','1');else try{localStorage.removeItem('esg-welcome-hide')}catch(e){}}
  $('#welcome').innerHTML='';if(next==='analysis')go('analysis');else if(next==='demo')loadDemo()}
(function boot(){const msgs=['Loading the ESG taxonomy…','Preparing the validation agent…','Connecting to the news monitor…','Ready.'];let i=0;
  const t=setInterval(()=>{const m=$('#splashMsg');if(m&&i<msgs.length-1)m.textContent=msgs[++i]},420);
  fetch(API+'/api/health').catch(()=>{}); /* wakes the backend early so the first real request is faster */
  setTimeout(()=>{clearInterval(t);$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),700);if(!store.get('esg-welcome-hide'))showWelcome()},1700)})();
render('page');
</script>
