<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESG Intelligence</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--bg:#07110d;--s1:#0c1b14;--s2:#112519;--g:#2fbf71;--gb:#6ee7a8;--gd:#15803d;--tx:#eef5f0;--ts:#b3c4ba;--tm:#76887e;--bd:rgba(110,231,168,.14);--bds:rgba(110,231,168,.32);--am:#e0a43a;--rd:#e5675f;--r:14px;--ez:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font:15px/1.65 'Inter',system-ui,sans-serif;color:var(--tx);background:radial-gradient(circle at 85% 0,rgba(47,191,113,.1),transparent 32%),radial-gradient(circle at 5% 25%,rgba(21,128,61,.07),transparent 30%),var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(110,231,168,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(110,231,168,.025) 1px,transparent 1px);background-size:44px 44px}
h1,h2,h3,button,.logo,th,.tag,.k,.big{font-family:'Space Grotesk','Inter',sans-serif}
h2{letter-spacing:-.02em;margin:34px 0 14px;font-size:24px}h3{margin:0 0 6px;font-size:16px}p{margin:0 0 10px}
header{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 28px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:rgba(7,17,13,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em}.logo b{color:var(--g)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--ts);padding:7px 14px;border-radius:8px;font-size:14px;position:relative}
nav button::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;background:var(--g);transform:scaleX(0);transition:transform .3s var(--ez);border-radius:2px}
nav button:hover{color:var(--tx)}nav button.on{color:var(--gb)}nav button.on::after{transform:scaleX(1)}
main{max-width:1100px;margin:0 auto;padding:30px 20px 50px;min-height:70vh}
footer{border-top:1px solid var(--bd);color:var(--tm);font-size:12.5px;text-align:center;padding:20px}
/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
.btn,.tabs button,nav button{position:relative;overflow:hidden;transition:transform .15s var(--ez),background .25s,border-color .25s,box-shadow .25s,color .25s}
.btn{font:600 14px 'Space Grotesk',sans-serif;padding:11px 22px;border-radius:10px;border:1px solid var(--bds);background:var(--s1);color:var(--tx)}
.btn:hover{background:var(--s2);border-color:var(--gb);transform:translateY(-2px);box-shadow:0 8px 24px rgba(47,191,113,.14)}
.btn:active,.tabs button:active{transform:scale(.96)}
.btn.primary{background:var(--g);border-color:var(--g);color:#04120a}.btn.primary:hover{background:var(--gb);border-color:var(--gb)}
.btn.s{background:transparent}.btn.sm{padding:7px 14px;font-size:13px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
/* hero */
.hero{position:relative;padding:54px 0 34px}
.hero::after{content:"";position:absolute;width:480px;height:480px;right:-160px;top:-170px;background:rgba(47,191,113,.09);filter:blur(100px);border-radius:50%;pointer-events:none;animation:drift 12s ease-in-out infinite alternate}
.eyebrow{display:inline-block;font:600 12px 'Space Grotesk',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gb);border:1px solid var(--bds);border-radius:99px;padding:5px 14px;margin-bottom:18px;background:rgba(47,191,113,.07)}
.hero h1{font-size:clamp(36px,6vw,68px);line-height:1.02;letter-spacing:-.035em;margin:0 0 18px;max-width:880px;font-weight:700}
.hero h1 span{background:linear-gradient(90deg,var(--g),var(--gb));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ts);max-width:650px;font-size:17px}.cta{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 22px}
.trust{display:flex;gap:18px;flex-wrap:wrap;color:var(--tm);font-size:13px}.trust span::before{content:"✓ ";color:var(--g)}
/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));margin-bottom:16px}
.card{background:linear-gradient(145deg,rgba(18,42,31,.85),rgba(8,23,16,.9));border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.3);transition:transform .3s var(--ez),border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px);border-color:var(--bds);box-shadow:0 24px 60px rgba(0,0,0,.4),0 0 30px rgba(47,191,113,.06)}
.card p{color:var(--ts);font-size:14px;margin:0}
.feat svg{width:26px;height:26px;stroke:var(--g);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px;transition:transform .4s var(--ez)}.feat:hover svg{transform:scale(1.12) rotate(-4deg)}
.k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--tm);margin-bottom:6px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.flow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.flow .n{border:1px solid var(--bds);background:var(--s1);border-radius:8px;padding:8px 14px;font:600 13px 'Space Grotesk',sans-serif;transition:.25s}.flow .n:hover{background:var(--s2);color:var(--gb);transform:translateY(-2px)}.flow .ar{color:var(--g)}
/* upload */
.drop{position:relative;overflow:hidden;text-align:center;padding:52px 20px;border:1.5px dashed rgba(110,231,168,.35);border-radius:18px;background:linear-gradient(145deg,rgba(17,48,33,.55),rgba(6,19,13,.75));cursor:pointer;transition:.3s var(--ez)}
.drop:hover,.drop.hv{border-color:var(--g);transform:translateY(-2px);box-shadow:0 0 40px rgba(47,191,113,.1);background:linear-gradient(145deg,rgba(20,65,41,.6),rgba(7,24,15,.85))}
.drop:active{transform:scale(.99)}.drop.hv{transform:scale(1.01)}
.drop .up{width:44px;height:44px;stroke:var(--g);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;animation:float 3s ease-in-out infinite}
.drop span{color:var(--tm);font-size:13.5px}.hide{display:none}
/* status tags */
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid transparent}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.Disclosed,.Strong,.High{background:rgba(47,191,113,.12);color:var(--gb);border-color:rgba(47,191,113,.28)}
.Inferred,.Moderate,.Medium,.Limited{background:rgba(224,164,58,.12);color:var(--am);border-color:rgba(224,164,58,.28)}
.Not,.Low,.None{background:rgba(229,103,95,.12);color:var(--rd);border-color:rgba(229,103,95,.28)}
.meter{height:5px;border-radius:9px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}.meter div{height:100%;width:var(--w);background:linear-gradient(90deg,var(--gd),var(--g),var(--gb));border-radius:9px;animation:grow 1.1s var(--ez) both}
/* tabs & table */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:26px 0 16px;flex-wrap:wrap;align-items:center}
.tabs button{background:none;border:0;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--tm);font-size:14px;font-weight:600;position:relative}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--g);transform:scaleX(0);transition:transform .3s var(--ez);box-shadow:0 0 10px rgba(110,231,168,.4)}
.tabs button:hover{color:var(--ts)}.tabs button.on{color:var(--gb)}.tabs button.on::after{transform:scaleX(1)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--s1)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{background:#0d2117;color:var(--ts);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;text-align:left}
th,td{padding:13px 15px;border-bottom:1px solid var(--bd);vertical-align:top;text-align:left}tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}tbody tr:hover{background:rgba(47,191,113,.05)}
a.lnk{color:var(--g);cursor:pointer;font-size:13px;border-bottom:1px solid transparent;transition:.2s}a.lnk:hover{color:var(--gb);border-color:var(--gb)}
ul{padding-left:20px;margin:6px 0 0}li{margin:6px 0;color:var(--ts);font-size:14px}
/* pipeline */
.pipe{display:flex;flex-direction:column;max-width:440px;margin-top:14px}
.st{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--tm);font-size:14px;position:relative;transition:color .3s}
.st i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bds);flex:none;transition:.3s;position:relative;z-index:1;background:var(--bg)}
.st:not(:last-child)::after{content:"";position:absolute;left:5px;top:26px;bottom:-8px;width:2px;background:var(--bd)}
.st.done{color:var(--tx)}.st.done i{background:var(--g);border-color:var(--g)}.st.done:not(:last-child)::after{background:var(--g)}
.st.run{color:var(--gb);font-weight:600}.st.run i{border-color:var(--gb);background:var(--gb);animation:pulse 1.4s infinite}
.st.err{color:var(--rd)}.st.err i{background:var(--rd);border-color:var(--rd)}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden;margin:12px 0}
.bar div{height:100%;width:0;border-radius:9px;transition:width .4s var(--ez);background:linear-gradient(90deg,var(--gd),var(--g),var(--gb),var(--g));background-size:200% 100%;animation:shim 2s linear infinite}
.banner{background:rgba(224,164,58,.1);color:var(--am);border:1px solid rgba(224,164,58,.35);border-radius:10px;padding:10px 16px;font:600 13px 'Space Grotesk',sans-serif;margin-bottom:16px}
.err{background:rgba(229,103,95,.1);color:var(--rd);border:1px solid rgba(229,103,95,.3);border-radius:10px;padding:12px 16px;margin:14px 0}
/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,10,7,.75);backdrop-filter:blur(8px);animation:fade .25s both}
.modal .card{max-width:660px;width:100%;max-height:82vh;overflow:auto;animation:pop .35s var(--ez) both}.modal .card:hover{transform:none}
blockquote{margin:8px 0 16px;padding:12px 16px;border-left:3px solid var(--g);background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;font-size:14px;color:var(--ts)}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(110,231,168,.5)}100%{box-shadow:0 0 0 9px rgba(110,231,168,0)}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes drift{to{transform:translate(-60px,50px)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
.a-page .reveal{opacity:0;animation:rise .65s var(--ez) forwards;animation-delay:calc(var(--i,0)*70ms)}
.a-page tbody tr,.a-tab tbody tr{opacity:0;animation:rise .45s var(--ez) forwards;animation-delay:calc(var(--i,0)*35ms)}
.a-tab .tabpane{animation:fade .35s both}
@media(max-width:700px){header{padding:10px 16px}main{padding:20px 14px}.big{font-size:25px}.hero{padding-top:30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.a-page .reveal,.a-page tbody tr,.a-tab tbody tr{opacity:1}}
.site-footer {
    margin-top: 60px;
    padding: 24px 20px;
    text-align: center;
    border-top: 1px solid rgba(57, 255, 136, 0.12);
    color: rgba(255, 255, 255, 0.45);
    font-size: 12px;
    letter-spacing: 0.02em;
}

.site-footer p {
    margin: 0;
}
</style></head><body>
<header><div class="logo">ESG <b>Intelligence</b></div><nav id="nav"></nav></header>
<main id="app"></main>
<footer>ESG Intelligence is an AI-assisted research prototype. It does not provide an ESG rating, assurance opinion, investment recommendation or compliance determination.</footer>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Same-origin when served by the backend; direct URL if the file is opened from disk */
const API='https://esg-intelligence-agent.onrender.com';

/* ---------- Demo (MOCK, fictional) ---------- */
const DEMO={demo:true,meta:{company:'Meridian Components Ltd (fictional)',type:'Mock Sustainability Report',year:'FY2025',pages:42},
f:{Environmental:[
{topic:'Scope 1 emissions',status:'Disclosed',value:'12,450 tCO2e',year:'FY2025',page:18,confidence:'High',quote:'Scope 1 emissions were 12,450 tCO2e in FY2025.'},
{topic:'Scope 2 emissions',status:'Disclosed',value:'31,200 tCO2e (market-based)',year:'FY2025',page:18,confidence:'High',quote:'Scope 2 (market-based) emissions totalled 31,200 tCO2e.'},
{topic:'Scope 3 emissions',status:'Not found',value:'',year:'',page:null,confidence:'',quote:''},
{topic:'Renewable energy',status:'Disclosed',value:'34% of electricity',year:'FY2025',page:21,confidence:'Medium',quote:'Renewable sources supplied 34% of electricity consumed.'},
{topic:'Net-zero commitment',status:'Inferred',value:'Net-zero ambition referenced; no dated target',year:'',page:6,confidence:'Low',quote:'We aspire to contribute to a net-zero economy.'}],
Social:[
{topic:'Employee diversity',status:'Disclosed',value:'Women: 22% of workforce',year:'FY2025',page:27,confidence:'High',quote:'Women represented 22% of our total workforce.'},
{topic:'Health & safety',status:'Disclosed',value:'LTIFR 0.41',year:'FY2025',page:30,confidence:'High',quote:'Lost time injury frequency rate was 0.41 per million hours.'},
{topic:'Human rights',status:'Not found',value:'',year:'',page:null,confidence:'',quote:''}],
Governance:[
{topic:'Board composition',status:'Disclosed',value:'4 of 9 directors independent',year:'FY2025',page:35,confidence:'High',quote:'Four of our nine directors are independent.'},
{topic:'Whistleblower mechanism',status:'Disclosed',value:'Vigil mechanism in place',year:'FY2025',page:37,confidence:'Medium',quote:'A vigil mechanism is available to all employees.'},
{topic:'Data privacy',status:'Not found',value:'',year:'',page:null,confidence:'',quote:''}]},
ins:{highlights:['Based on the analysed disclosure, Scope 1 and 2 emissions are reported with page-level support.','The report indicates 34% renewable electricity share.'],env:['Scope 3 emissions are not identified in the analysed document.','Net-zero language lacks a dated target and requires further verification.'],social:['The report indicates women at 22% of the workforce.','Human rights due diligence is not identified in the analysed document.'],gov:['Board independence is reported at 4 of 9 directors.','Data privacy disclosures are not identified in the analysed document.'],gaps:['Scope 3 emissions','Human rights due diligence','Data privacy'],risks:['Absence of Scope 3 data may understate value-chain climate exposure (requires further verification).'],investigate:['Request Scope 3 screening results.','Clarify net-zero target scope and timeline.']}};

/* ---------- State ---------- */
let S={view:'home',tab:'Environmental',res:null,stages:[],msg:'',prog:0,err:'',file:null,busy:false};
const STAGES=['Document','Extraction','Retrieval','ESG Analysis','Validation','Gap Analysis','Final Insights'];
function go(v){S.view=v;window.scrollTo({top:0,behavior:'smooth'});render('page')}
function setTab(t){S.tab=t;render('tab')}
function gaps(f){return Object.entries(f).flatMap(([c,l])=>l.filter(x=>x.status==='Not found'||x.confidence==='Low').map(x=>({cat:c,topic:x.topic,why:x.status==='Not found'?'Not identified in analysed document':'Weakly supported; requires further verification'})))}

/* ---------- Orchestrator: uploads to backend, polls real stage status ---------- */
function uploadFile(file){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',API+'/api/analyse');
  x.upload.onprogress=e=>{if(e.lengthComputable){S.prog=e.loaded/e.total;S.msg='Uploading...';const b=$('#pb');b&&(b.style.width=Math.round(S.prog*100)+'%');const m=$('#pmsg');m&&(m.textContent=S.msg)}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?ok(j):no({message:j.detail||'Upload failed.'})};
  x.onerror=()=>no({message:'Cannot reach the backend. Is it running, and on the address this page uses?'});
  const fd=new FormData();fd.append('file',file);x.send(fd)})}
function paintPipe(){const b=$('#pb');b&&(b.style.width=Math.round(S.prog*100)+'%');const m=$('#pmsg');m&&(m.textContent=S.msg);document.querySelectorAll('.st').forEach((el,i)=>el.className='st '+(S.stages[i]||''))}
async function runAnalysis(file){
  S.err='';S.busy=true;S.res=null;S.file=file;S.prog=0;S.stages=[];S.msg='Uploading...';render();
  try{
    const {job_id}=await uploadFile(file);
    while(true){const r=await fetch(API+'/api/jobs/'+job_id);if(!r.ok)throw{message:'Lost track of the analysis job.'};const j=await r.json();
      if(j.status==='error')throw{message:j.error};
      S.stages=STAGES.map((_,k)=>k<j.stage?'done':k===j.stage?'run':'');S.msg=j.msg;S.prog=j.progress||0;
      if(j.status==='done'){S.res=j.result;S.busy=false;S.tab='Environmental';render('page');return}
      $('#pb')?paintPipe():render();await new Promise(r=>setTimeout(r,700))}
  }catch(e){S.busy=false;S.err=e.message||'Analysis failed.';S.stages=S.stages.map(s=>s==='run'?'err':s);render()}}

/* ---------- Report export ---------- */
function reportMD(){const r=S.res,g=gaps(r.f);let m=`# ESG Analysis Report${r.demo?' (DEMO / SAMPLE – MOCK DATA)':''}\n\n**Company:** ${r.meta.company}\n**Report type:** ${r.meta.type}\n**Reporting period:** ${r.meta.year}\n**Pages analysed:** ${r.meta.pages}\n\n## Executive summary\n${(r.ins.highlights||[]).map(x=>'- '+x).join('\n')}\n\n## Extracted metrics\n`;
  for(const c in r.f){m+=`\n### ${c}\n| Topic | Value / disclosure | Year | Source | Confidence | Status |\n|---|---|---|---|---|---|\n`+r.f[c].map(x=>`| ${x.topic} | ${x.value||'Not identified in analysed document'} | ${x.year||'-'} | ${x.page?'Page '+x.page:'-'} | ${x.confidence||'-'} | ${x.status} |`).join('\n')+'\n'}
  m+=`\n## Insights\n`+[['Environmental','env'],['Social','social'],['Governance','gov'],['Potential risk areas','risks'],['Recommended further investigation','investigate']].map(([t,k])=>`### ${t}\n`+(r.ins[k]||[]).map(x=>'- '+x).join('\n')).join('\n\n');
  m+=`\n\n## Disclosure gaps\n`+g.map(x=>`- ${x.cat}: ${x.topic} – ${x.why}`).join('\n');
  m+=`\n\n## Source references\n`+Object.values(r.f).flat().filter(x=>x.page).map(x=>`- ${x.topic}, page ${x.page}: "${x.quote}"`).join('\n');
  m+=`\n\n## AI limitations\nAI-assisted prototype. Not an ESG rating, assurance opinion, investment recommendation or compliance determination. Extraction may miss or misread content (tables, scanned pages); verify all findings against the source document.\n`;return m}
async function exportReport(){
  if(!job_id){
    alert('No completed analysis is available.');
    return;
  }

  try{
    const response = await fetch(
      API + '/api/jobs/' + job_id + '/report'
    );

    if(!response.ok){
      const text = await response.text();
      throw new Error(text || 'Could not generate PDF report.');
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'ESG_Intelligence_Report.pdf';

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

  }catch(error){
    console.error('PDF download failed:', error);
    alert('PDF download failed: ' + (error.message || error));
  }
}

/* ---------- Views ---------- */
const ICON=['<path d="M4 5h16M4 12h16M4 19h10"/>','<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>','<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>'].map(p=>`<svg viewBox="0 0 24 24">${p}</svg>`);
function viewSource(cat,topic){const x=S.res.f[cat].find(i=>i.topic===topic);const ctx=x.context||'';
  $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="k">${esc(cat)} · ${S.res.demo?'MOCK excerpt':'Source'}</div><h3>${esc(topic)} — page ${esc(x.page)}</h3><p class="k" style="margin-top:14px">Extracted quote</p><blockquote>${esc(x.quote)}</blockquote>${ctx?`<p class="k">Surrounding page text</p><blockquote>…${esc(ctx)}…</blockquote>`:''}${x.note?`<p class="err">${esc(x.note)}</p>`:''}<button class="btn sm" onclick="closeModal()">Close</button></div></div>`}
function closeModal(){$('#modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const tagCls=x=>x.replace(/ .*/,'');
function ind(l){const n=l.filter(x=>x.status==='Disclosed'&&x.confidence!=='Low').length,r=n/l.length;return n===0?'Not found':r>=.7?'Strong disclosure':r>=.4?'Moderate disclosure':'Limited disclosure'}
function home(){return`<section class="hero"><span class="eyebrow reveal">AI-assisted ESG disclosure analysis</span><h1 class="reveal">Turn ESG Disclosures into <span>Actionable Intelligence.</span></h1><p class="reveal">Upload a sustainability or annual report and use AI to extract ESG metrics, identify disclosure gaps, and generate structured sustainability insights.</p><div class="cta reveal"><button class="btn primary" onclick="go('analysis')">Start Analysis</button><button class="btn s" onclick="loadDemo()">View Demo</button></div><div class="trust reveal"><span>Source-traceable</span><span>Validation-first</span><span>No black-box scores</span></div></section>
<div class="grid">${[['ESG Metric Extraction','Extract disclosed environmental, social and governance metrics.'],['Disclosure Gap Analysis','Identify areas where information appears missing, unclear, or insufficiently disclosed.'],['AI-Powered Insights','Generate structured sustainability insights from the uploaded document.']].map((c,i)=>`<div class="card feat reveal">${ICON[i]}<h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>
<h2 class="reveal">How it works</h2><div class="flow reveal">${['Input','Document Retrieval','AI Reasoning','Validation','ESG Insights'].map(n=>`<span class="n">${n}</span>`).join('<span class="ar">→</span>')}</div>
<div class="card reveal"><h3>Why agentic AI?</h3><p>The workflow separates document retrieval, ESG extraction, validation and gap analysis into distinct reasoning stages, allowing the system to verify information before presenting insights.</p></div>`}
function upload(){return`<h2 class="reveal" style="margin-top:0">Document analysis</h2><div class="drop reveal" id="drop" onclick="$('#fi').click()"><svg class="up" viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><div><b>Drag and drop a PDF here</b></div><span>or click to browse · PDF only · up to 25 MB · processed by your local server</span><input id="fi" type="file" accept="application/pdf" class="hide"></div><p class="reveal" style="margin-top:16px"><button class="btn s" onclick="loadDemo()">Run Demo / Sample Analysis</button></p>`}
function pipeline(){return`<div class="card reveal"><div class="k">Agent workflow</div>${S.file?`<p><b>${esc(S.file.name)}</b> · ${(S.file.size/1048576).toFixed(2)} MB</p>`:''}<div class="bar"><div id="pb" style="width:${Math.round(S.prog*100)}%"></div></div><p id="pmsg" style="color:var(--ts)">${esc(S.msg)}</p><div class="pipe">${STAGES.map((s,i)=>`<div class="st ${S.stages[i]||''}"><i></i>${s}</div>`).join('')}</div></div>`}
function dash(){const r=S.res,all=Object.values(r.f).flat(),dis=all.filter(x=>x.status==='Disclosed').length,cov=Math.round(100*dis/all.length),l=r.f[S.tab];
  return`${r.demo?'<div class="banner reveal">Demo / Sample Analysis — fictional mock company and mock data, not a real report.</div>':''}
<div class="grid">${[['Company',r.meta.company],['Report type',r.meta.type],['Reporting year',r.meta.year]].map(a=>`<div class="card reveal"><div class="k">${a[0]}</div><b>${esc(a[1])}</b></div>`).join('')}<div class="card reveal"><div class="k">Pages analysed</div><b class="big" data-count="${+r.meta.pages||0}">${esc(r.meta.pages)}</b></div></div>
<div class="grid">${Object.keys(r.f).map(c=>{const i=ind(r.f[c]),n=r.f[c].filter(x=>x.status==='Disclosed').length,t=r.f[c].length;return`<div class="card reveal"><div class="k">${c}</div><span class="tag ${tagCls(i)}">${i}</span><div class="meter"><div style="--w:${Math.round(100*n/t)}%"></div></div><p style="margin-top:8px;font-size:12.5px;color:var(--tm)">${n} of ${t} topics disclosed</p></div>`}).join('')}<div class="card reveal"><div class="k">Disclosure coverage</div><b class="big" data-count="${cov}" data-suffix="%">${cov}%</b><p style="font-size:12.5px;color:var(--tm)">${dis} of ${all.length} topics explicitly disclosed</p></div></div>
<div class="tabs reveal">${[...Object.keys(r.f),'Insights','Gaps'].map(t=>`<button class="${S.tab===t?'on':''}" onclick="setTab('${t}')">${t}</button>`).join('')}<span style="flex:1"></span><button class="btn sm" onclick="exportReport()">Export report</button></div>
<div class="tabpane">${S.tab==='Insights'?insightsV(r):S.tab==='Gaps'?gapsV(r):`<div class="tw"><table><thead><tr><th>Metric / topic</th><th>Value or disclosure</th><th>Year</th><th>Source</th><th>Confidence</th><th>Status</th></tr></thead><tbody>${l.map(x=>`<tr><td>${esc(x.topic)}</td><td>${x.status==='Not found'?'<i style="color:var(--tm)">Not identified in analysed document</i>':esc(x.value)}</td><td>${esc(x.year||'—')}</td><td>${x.page?`Page ${x.page}<br><a class="lnk" onclick="viewSource('${S.tab}','${esc(x.topic).replace(/'/g,"\\'")}')">View source</a>`:'—'}</td><td>${x.confidence?`<span class="tag ${x.confidence}">${x.confidence}</span>`:'—'}</td><td><span class="tag ${tagCls(x.status)}">${x.status}</span></td></tr>`).join('')}</tbody></table></div>`}</div>`}
function list(t,a){return`<div class="card"><h3>${t}</h3><ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>None generated.</li>'}</ul></div>`}
function insightsV(r){const i=r.ins;return`<div class="grid">${list('Key ESG highlights',i.highlights)}${list('Environmental insights',i.env)}${list('Social insights',i.social)}${list('Governance insights',i.gov)}${list('Potential risk areas',i.risks)}${list('Recommended areas for further investigation',i.investigate)}</div><p style="font-size:13px;color:var(--tm)">AI-generated observations from the analysed document; not verified facts.</p>`}
function gapsV(r){return`<div class="tw"><table><thead><tr><th>Pillar</th><th>Topic</th><th>Assessment</th></tr></thead><tbody>${gaps(r.f).map(g=>`<tr><td>${g.cat}</td><td>${esc(g.topic)}</td><td>${g.why}</td></tr>`).join('')||'<tr><td colspan=3>No gaps flagged.</td></tr>'}</tbody></table></div>`}
function analysis(){return(S.res?'':upload())+(S.busy||S.err?pipeline():'')+(S.err?`<div class="err">${esc(S.err)}</div>`:'')+(S.res?dash():'')}
function method(){const s=['PDF ingestion','Text extraction (page numbers preserved)','Document chunking','Retrieval (TF-IDF keyword vector search per ESG topic)','LLM-based ESG analysis','Validation (quotes and figures checked against source text)','Gap analysis','Report generation'];
  return`<h2 class="reveal" style="margin-top:0">Methodology</h2><div class="card reveal"><ol>${s.map(x=>`<li>${x}</li>`).join('')}</ol><p style="margin-top:12px">Validation is deterministic: each quote must appear verbatim in the PDF, and each number in a value must appear in that quote. Failures are downgraded to low confidence or "Inferred". Statuses: <b>Disclosed</b> (explicit), <b>Inferred</b> (indirect or unsupported), <b>Not found</b>. No numerical ESG score is produced.</p></div><div class="card reveal" style="margin-top:16px"><b>This tool is an AI-assisted research and analysis prototype. It does not provide an official ESG rating, assurance opinion, investment recommendation, or regulatory compliance determination.</b></div>`}
function about(){return`<h2 class="reveal" style="margin-top:0">About</h2><div class="card reveal"><p>ESG Intelligence is a portfolio prototype that demonstrates an auditable, agentic AI workflow for ESG disclosure analysis. Extraction, retrieval, analysis and validation run on a local Python backend that calls an existing LLM; the API key never reaches the browser. Known limits: no OCR for scanned PDFs, table extraction is approximate, retrieval is keyword-based rather than embedding-based, and the LLM may misread content.</p></div>`}
function loadDemo(){S.res=DEMO;S.err='';S.busy=false;S.view='analysis';S.tab='Environmental';window.scrollTo({top:0,behavior:'smooth'});render('page')}

/* ---------- Render + motion ---------- */
function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;p<1&&requestAnimationFrame(f)})(t0)})}
function render(mode){const v=S.view,app=$('#app');
  $('#nav').innerHTML=[['Dashboard','home'],['Analysis','analysis'],['Methodology','method'],['About','about']].map(([l,k])=>`<button class="${v===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  app.className=mode==='page'?'a-page':mode==='tab'?'a-tab':'';
  app.innerHTML={home,analysis,method,about}[v]();
  if(mode){app.querySelectorAll('.reveal,tbody tr').forEach((el,i)=>el.style.setProperty('--i',i));mode==='page'&&countUp()}
  bindDrop()}
function bindDrop(){const d=$('#drop'),fi=$('#fi');if(!d)return;
  const pick=f=>{if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){S.err='Only PDF files are supported.';render();return}runAnalysis(f)};
  fi.onchange=()=>pick(fi.files[0]);d.ondragover=e=>{e.preventDefault();d.classList.add('hv')};d.ondragleave=()=>d.classList.remove('hv');d.ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files[0])}}
/* click ripple on buttons */
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.tabs button,nav button');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,d=document.createElement('span');
  d.className='ripple';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),650)});
render('page');
</script>
