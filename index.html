<style>

.seg{display:flex;border:1px solid var(--bds);border-radius:10px;overflow:hidden}.seg button{background:var(--s1);border:0;padding:0 16px;color:var(--ts);font-size:13.5px}.seg button.on{background:var(--g);color:#04120a;font-weight:600}

@keyframes leaf{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes stem{to{stroke-dashoffset:0}}@keyframes load{to{width:100%}}
.welcome{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,10,7,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .35s both}

.welcome h2{font-size:clamp(26px,4vw,36px);margin:4px 0 8px}.welcome h2 span{background:linear-gradient(90deg,var(--g),var(--gb));-webkit-background-clip:text;background-clip:text;color:transparent}
.steps{display:grid;gap:12px;margin:22px 0}.step{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--bd);border-radius:12px;background:rgba(7,17,13,.5);opacity:0;animation:rise .5s var(--ez) forwards;animation-delay:calc(.15s + var(--i)*90ms)}

.step h3{font-size:15px;margin:2px 0 3px}.step p{font-size:13.5px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:26px 0 16px;flex-wrap:wrap;align-items:center}
.tabs button{background:none;border:0;border-radius:8px 8px 0 0;padding:10px 16px;color:var(--tm);font-size:14px;font-weight:600;position:relative}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--g);transform:scaleX(0);transition:transform .3s var(--ez);box-shadow:0 0 10px rgba(110,231,168,.4)}
.tabs button:hover{color:var(--ts)}.tabs button.on{color:var(--gb)}.tabs button.on::after{transform:scaleX(1)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--s1)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{background:#0d2117;color:var(--ts);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;text-align:left}
th,td{padding:13px 15px;border-bottom:1px solid var(--bd);vertical-align:top;text-align:left}tr:last-child td{border-bottom:0}
tbody tr{transition:background .2s}tbody tr:hover{background:rgba(47,191,113,.05)}
a.lnk{color:var(--g);cursor:pointer;font-size:13px;border-bottom:1px solid transparent;transition:.2s}a.lnk:hover{color:var(--gb);border-color:var(--gb)}
ul{padding-left:20px;margin:6px 0 0}li{margin:6px 0;color:var(--ts);font-size:14px}
/* pipeline */
.pipe{display:flex;flex-direction:column;max-width:440px;margin-top:14px}
.st{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--tm);font-size:14px;position:relative;transition:color .3s}
.st i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bds);flex:none;transition:.3s;position:relative;z-index:1;background:var(--bg)}
.st:not(:last-child)::after{content:"";position:absolute;left:5px;top:26px;bottom:-8px;width:2px;background:var(--bd)}
.st.done{color:var(--tx)}.st.done i{background:var(--g);border-color:var(--g)}.st.done:not(:last-child)::after{background:var(--g)}
.st.run{color:var(--gb);font-weight:600}.st.run i{border-color:var(--gb);background:var(--gb);animation:pulse 1.4s infinite}

.bar{height:6px;background:rgba(255,255,255,.07);border-radius:9px;overflow:hidden;margin:12px 0}
.bar div{height:100%;width:0;border-radius:9px;transition:width .4s var(--ez);background:linear-gradient(90deg,var(--gd),var(--g),var(--gb),var(--g));background-size:200% 100%;animation:shim 2s linear infinite}
.banner{background:rgba(224,164,58,.1);color:var(--am);border:1px solid rgba(224,164,58,.35);border-radius:10px;padding:10px 16px;font:600 13px 'Space Grotesk',sans-serif;margin-bottom:16px}
.err{background:rgba(229,103,95,.1);color:var(--rd);border:1px solid rgba(229,103,95,.3);border-radius:10px;padding:12px 16px;margin:14px 0}
/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,10,7,.75);backdrop-filter:blur(8px);animation:fade .25s both}
.modal .card{max-width:660px;width:100%;max-height:82vh;overflow:auto;animation:pop .35s var(--ez) both}.modal .card:hover{transform:none}
blockquote{margin:8px 0 16px;padding:12px 16px;border-left:3px solid var(--g);background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;font-size:14px;color:var(--ts)}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.site-footer {
    margin-top: 60px;
    padding: 24px 20px;

    color: rgba(255, 255, 255, 0.45);
    font-size: 12px;

.site-footer p {
    margin: 0;

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Same-origin when served by the backend; direct URL if the file is opened from disk */
const API=location.port==='8000'?'':'https://esg-intelligence-agent.onrender.com';

/* ---------- Demo (MOCK, fictional) ---------- */
const DEMO={demo:true,meta:{company:'Meridian Components Ltd (fictional)',type:'Mock Sustainability Report',year:'FY2025',pages:42},
f:{Environmental:[
{topic:'Scope 1 emissions',status:'Found',value:'12,450 tCO2e',year:'FY2025',page:18,confidence:'High',quote:'Scope 1 emissions were 12,450 tCO2e in FY2025.'},
{topic:'Scope 2 emissions',status:'Found',value:'31,200 tCO2e (market-based)',year:'FY2025',page:18,confidence:'High',quote:'Scope 2 (market-based) emissions totalled 31,200 tCO2e.'},
{topic:'Scope 3 emissions',status:'Not found',value:'',year:'',page:null,confidence:'',quote:''},
{topic:'Renewable energy',status:'Found',value:'34% of electricity',year:'FY2025',page:21,confidence:'Medium',quote:'Renewable sources supplied 34% of electricity consumed.'},
{topic:'Net-zero commitment',status:'Inferred',value:'Net-zero ambition referenced; no dated target',year:'',page:6,confidence:'Low',quote:'We aspire to contribute to a net-zero economy.'}],
Social:[

{topic:'Health & safety',status:'Found',value:'LTIFR 0.41',year:'FY2025',page:30,confidence:'High',quote:'Lost time injury frequency rate was 0.41 per million hours.'},
{topic:'Human rights',status:'Not found',value:'',year:'',page:null,confidence:'',quote:''}],
Governance:[
{topic:'Board composition',status:'Found',value:'4 of 9 directors independent',year:'FY2025',page:35,confidence:'High',quote:'Four of our nine directors are independent.'},
{topic:'Whistleblower mechanism',status:'Found',value:'Vigil mechanism in place',year:'FY2025',page:37,confidence:'Medium',quote:'A vigil mechanism is available to all employees.'},
{topic:'Data privacy',status:'Not found',value:'',year:'',page:null,confidence:'',quote:''}]},
ins:{highlights:['Based on the analysed disclosure, Scope 1 and 2 emissions are reported with page-level support.','The report indicates 34% renewable electricity share.'],env:['Scope 3 emissions are not identified in the analysed document.','Net-zero language lacks a dated target and requires further verification.'],social:['The report indicates women at 22% of the workforce.','Human rights due diligence is not identified in the analysed document.'],gov:['Board independence is reported at 4 of 9 directors.','Data privacy disclosures are not identified in the analysed document.'],gaps:['Scope 3 emissions','Human rights due diligence','Data privacy'],risks:['Absence of Scope 3 data may understate value-chain climate exposure (requires further verification).'],investigate:['Request Scope 3 screening results.','Clarify net-zero target scope and timeline.']}};

let searchResults=[];
let searchBusy=false;
/* Curated company list: only these companies can be searched (companies.json). */
let CO=[],coRegion='All',coPick=null,searchMeta=null,searchErr='';
fetch('companies.json').then(r=>r.json()).then(d=>{CO=d;if(S.view==='analysis'&&!S.res)render()}).catch(()=>{});
const coKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9&]+/g,' ').trim();
function coMatches(q){q=coKey(q);return CO.filter(c=>(coRegion==='All'||c.region===coRegion)&&(!q||[c.name,c.id,c.sector,...c.aliases].some(n=>coKey(n).includes(q))))}
function coListHTML(q){const l=coMatches(q);
  return l.length?l.map(c=>`<button class="co ${coPick&&coPick.id===c.id?'on':''}" onclick="pickCompany('${c.id}')"><b>${esc(c.name)}</b><span>${esc(c.sector)} · ${esc(c.region)}</span></button>`).join(''):'<p style="color:var(--tm);margin:6px 0">No supported company matches. Pick one from the list.</p>'}

async function searchCompany(){

async function analyseReportUrl(encodedUrl){
  const url=decodeURIComponent(encodedUrl);

  S.err='';
  S.busy=true;
  S.res=null;
  S.sd={busy:false,err:'',res:null};
  S.file=null;
  S.prog=0;
  S.stages=[];
  S.msg='Downloading selected report...';
  render();

  try{
    const response=await fetch(API+'/api/analyse-url',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url})
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.detail||'Could not analyse selected report.');
    }

    completedJobId=data.job_id;

    while(true){
      const r=await fetch(API+'/api/jobs/'+data.job_id);

      if(!r.ok){
        throw new Error('Lost track of the analysis job.');
      }

      const j=await r.json();

      if(j.status==='error'){
        throw new Error(j.error||'Analysis failed.');
      }

      S.stages=STAGES.map((_,k)=>
        k<j.stage?'done':k===j.stage?'run':''
      );

      S.msg=j.msg||'Analysing...';
      S.prog=j.progress||0;

      if(j.status==='done'){
        S.res=j.result;
        S.busy=false;
        S.tab='Environmental';
        render('page');
        return;
      }

      $('#pb')?paintPipe():render();
      await new Promise(r=>setTimeout(r,700));
    }

  }catch(e){
    S.busy=false;
    S.err=e.message||'Analysis failed.';
    S.stages=S.stages.map(x=>x==='run'?'err':x);
    render();
  }
}

const STAGES=['Document','Extraction','Retrieval','ESG Analysis','Validation','Gap Analysis','Final Insights'];
function go(v){S.view=v;window.scrollTo({top:0,behavior:'smooth'});render('page')}
function setTab(t){S.tab=t;render('tab')}
function gaps(f){
  return Object.entries(f).flatMap(([c,l])=>
    l.filter(x=>
      x.status==='Not found' ||
      x.confidence==='Low' ||
      x.metric_status==='Not available' ||
      x.metric_status==='Unclear'
    ).map(x=>({
      cat:c,
      topic:x.topic,
      type:x.gap_type||'',
      why:x.gap_reason ||
        (x.status==='Not found'
          ? 'Not identified in analysed document'
          : x.confidence==='Low'
            ? 'Supporting evidence requires further verification'
            : 'Metric not identified')
    }))
  );
}

/* ---------- Orchestrator: uploads to backend, polls real stage status ---------- */
let completedJobId = null;

function uploadFile(file){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',API+'/api/analyse');
  x.upload.onprogress=e=>{if(e.lengthComputable){S.prog=e.loaded/e.total;S.msg='Uploading...';const b=$('#pb');b&&(b.style.width=Math.round(S.prog*100)+'%');const m=$('#pmsg');m&&(m.textContent=S.msg)}};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?ok(j):no({message:j.detail||'Upload failed.'})};
  x.onerror=()=>no({message:'Cannot reach the backend. Is it running, and on the address this page uses?'});
  const fd=new FormData();fd.append('file',file);x.send(fd)})}
function paintPipe(){const b=$('#pb');b&&(b.style.width=Math.round(S.prog*100)+'%');const m=$('#pmsg');m&&(m.textContent=S.msg);document.querySelectorAll('.st').forEach((el,i)=>el.className='st '+(S.stages[i]||''))}
async function runAnalysis(file){
  S.err='';S.busy=true;S.res=null;S.sd={busy:false,err:'',res:null};S.file=file;S.prog=0;S.stages=[];S.msg='Uploading...';render();
  try{
    const {job_id}=await uploadFile(file);
completedJobId = job_id;
    while(true){const r=await fetch(API+'/api/jobs/'+job_id);if(!r.ok)throw{message:'Lost track of the analysis job.'};const j=await r.json();
      if(j.status==='error')throw{message:j.error};
      S.stages=STAGES.map((_,k)=>k<j.stage?'done':k===j.stage?'run':'');S.msg=j.msg;S.prog=j.progress||0;
      if(j.status==='done'){S.res=j.result;S.busy=false;S.tab='Environmental';render('page');return}
      $('#pb')?paintPipe():render();await new Promise(r=>setTimeout(r,700))}
  }catch(e){S.busy=false;S.err=e.message||'Analysis failed.';S.stages=S.stages.map(s=>s==='run'?'err':s);render()}}

  for(const c in r.f){m+=`\n### ${c}\n| Topic | Value / disclosure | Year | Source | Confidence | Status |\n|---|---|---|---|---|---|\n`+r.f[c].map(x=>`| ${x.topic} | ${x.value||'Not identified in analysed document'} | ${x.year||'-'} | ${x.page?'Page '+x.page:'-'} | ${x.confidence||'-'} | ${x.status} |`).join('\n')+'\n'}
  m+=`\n## Insights\n`+[['Environmental','env'],['Social','social'],['Governance','gov'],['Potential risk areas','risks'],['Recommended further investigation','investigate']].map(([t,k])=>`### ${t}\n`+(r.ins[k]||[]).map(x=>'- '+x).join('\n')).join('\n\n');
  m+=`\n\n## Disclosure gaps\n`+g.map(x=>`- ${x.cat}: ${x.topic} – ${x.why}`).join('\n');

  m+=`\n\n## AI limitations\nAI-assisted prototype. Not an ESG rating, assurance opinion, investment recommendation or compliance determination. Extraction may miss or misread content (tables, scanned pages); verify all findings against the source document.\n`;return m}
async function exportReport(){
  if(!completedJobId){
    alert('No completed analysis is available.');
    return;
  }

  try{
    const response = await fetch(
      API + '/api/jobs/' + completedJobId + '/report'
    );

    if(!response.ok){
      const text = await response.text();
      throw new Error(text || 'Could not generate PDF report.');
    }

    const blob = await response.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'ESG_Intelligence_Report.pdf';

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

  }catch(error){
    console.error('PDF download failed:', error);
    alert('PDF download failed: ' + (error.message || error));
  }
}

function method(){const s=['PDF ingestion','Text extraction (page numbers preserved)','Document chunking','Retrieval (TF-IDF keyword vector search per ESG topic)','LLM-based ESG analysis','Validation (quotes and figures checked against source text)','Gap analysis','Report generation'];
  return`<h2 class="reveal" style="margin-top:0">Methodology</h2><div class="card reveal"><ol>${s.map(x=>`<li>${x}</li>`).join('')}</ol><p style="margin-top:12px">Validation is deterministic: each quote must appear verbatim in the PDF, and each number in a value must appear in that quote. Failures are downgraded to low confidence or "Inferred". Statuses: <b>Disclosed</b> (explicit), <b>Inferred</b> (indirect or unsupported), <b>Not found</b>. No numerical ESG score is produced for the report.</p></div><div class="card reveal" style="margin-top:16px"><h3>Controversy Watch</h3><p>Headlines come from GDELT and Google News and are kept only when they name the company. Each is classified by pillar, subcategory and evidence stage (one batched LLM call, with labelled keyword rules as fallback). <b>Severity</b> (0–100) is a weighted sum of seven factors — magnitude 22%, regulatory 18%, scale 16%, reputational 16%, financial 14%, recurrence 9%, source credibility 5% — multiplied by the evidence stage (allegation 0.80, investigation 0.92, confirmed 1.00, resolved 0.55). Articles on the same subcategory within 30 days form one incident. The <b>news risk score</b> sums incident severities with a 45-day half-life and saturates at 100. The <b>say-do check</b> maps each controversy type to the related report topics and flags where the report has no validated disclosure. These scores describe news coverage, not company conduct.</p></div><div class="card reveal" style="margin-top:16px"><b>This tool is an AI-assisted research and analysis prototype. It does not provide an official ESG rating, assurance opinion, investment recommendation, or regulatory compliance determination.</b></div>`}

const dAgo=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
DEMO_WATCH.incidents.forEach(i=>{i.stories.forEach(s=>s.date=dAgo(s.ago));i.first_date=i.stories[0].date;i.last_date=i.stories[i.stories.length-1].date});
const PILLAR={E:'Environmental',S:'Social',G:'Governance'};
const STAGE={allegation:'Allegation',investigation:'Under investigation',confirmed:'Confirmed violation',resolved:'Resolved'};
const FACTOR=[['magnitude','Magnitude',22],['scale','Scale of impact',16],['regulatory','Regulatory',18],['reputational','Reputational',16],['financial','Financial',14],['recurrence','Recurrence',9],['credibility','Source credibility',5]];
const bandOf=s=>s>=80?4:s>=60?3:s>=40?2:s>=20?1:0;
const BAND=['Low','Moderate','Elevated','High','Critical'];
const sevTag=s=>`<span class="tag sev${bandOf(s)}">${s} · ${BAND[bandOf(s)]}</span>`;
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
let W={q:'',days:90,busy:false,err:'',res:null};
async function fetchScan(company,days,jobId){
  const r=await fetch(API+'/api/controversies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company,days,job_id:jobId||''})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||'The news scan failed.');
  return j}
async function runWatch(){
  const el=$('#watchQ');W.q=(el?el.value:W.q).trim();const d=$('#watchDays');W.days=d?+d.value:W.days;
  if(!W.q){W.err='Enter a company name.';render();return}
  W.busy=true;W.err='';W.res=null;render();
  try{W.res=await fetchScan(W.q,W.days)}catch(e){W.err=e.message==='Failed to fetch'?'Cannot reach the backend. Try the demo scan, or run the backend locally.':e.message}
  W.busy=false;render('page')}
function demoWatch(){W={q:'',days:90,busy:false,err:'',res:DEMO_WATCH};render('page')}
function riskCards(r){return`<div class="grid"><div class="card reveal"><div class="k">News risk score</div><b class="big" data-count="${r.risk.overall}">${r.risk.overall}</b> <span class="tag sev${bandOf(r.risk.overall)}">${esc(r.risk.band)}</span><p style="margin-top:8px;font-size:12.5px;color:var(--tm)">${r.counts.incidents} incident${r.counts.incidents===1?'':'s'} from ${r.counts.relevant} of ${r.counts.articles} headlines · last ${r.days} days</p></div>${['E','S','G'].map(p=>`<div class="card reveal"><div class="k">${PILLAR[p]}</div><b class="big" data-count="${r.risk[p]}">${r.risk[p]}</b><div class="meter"><div style="--w:${r.risk[p]}%"></div></div></div>`).join('')}</div>`}
function incRows(r,key){return r.incidents.map((i,n)=>`<tr><td style="white-space:nowrap">${esc(i.id)}</td><td>${PILLAR[i.pillar]}<br><span style="color:var(--tm);font-size:12.5px">${esc(i.sub)}</span></td><td>${esc(i.stories[i.stories.length-1].headline)}</td><td>${esc(STAGE[i.stage]||i.stage)}</td><td>${sevTag(i.severity)}</td><td>${esc(i.last_date)}<br><a class="lnk" onclick="viewIncident('${key}',${n})">${i.stories.length} report${i.stories.length===1?'':'s'} · details</a></td></tr>`).join('')}
function watchRes(r,key){
  return`${r.demo?'<div class="banner reveal">Demo scan — synthetic headlines about a fictional company. Not real events.</div>':''}
  ${riskCards(r)}
  ${r.signals.length?`<h2 class="reveal">Signals</h2><div class="grid">${r.signals.map(s=>`<div class="card reveal"><div class="k">${esc(s.type)}</div><h3>${esc(s.title)}</h3><p>${esc(s.why)}</p></div>`).join('')}</div>`:''}
  <h2 class="reveal">Incidents</h2>
  ${r.incidents.length?`<div class="tw"><table><thead><tr><th>ID</th><th>Pillar</th><th>Latest headline</th><th>Evidence stage</th><th>Severity</th><th>Last report</th></tr></thead><tbody>${incRows(r,key)}</tbody></table></div>`:'<div class="card reveal"><p>No ESG controversy headlines naming this company were found in the period. That is an absence of matching coverage, not a clean bill of health.</p></div>'}
  <p style="font-size:13px;color:var(--tm);margin-top:14px">Classifier: ${r.classifier==='llm'?'LLM reading of headlines':'keyword rules (labelled estimate, not an AI reading)'} · ${(r.sources||[]).map(esc).join(' · ')}. Scores describe news coverage from headlines only. An allegation or investigation is not a finding of fault.</p>`}
function watch(){
  return`<h2 class="reveal" style="margin-top:0">Controversy Watch</h2>
  <div class="card reveal" style="margin-bottom:18px"><div class="k">News monitoring</div><h3 style="font-size:20px;margin-bottom:6px">Scan a company for ESG controversies</h3>
  <p style="color:var(--ts);margin-bottom:14px">Collects recent headlines, classifies them by pillar and evidence stage, and scores severity with a transparent weighted model.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="watchQ" type="text" value="${esc(W.q)}" list="coNames" placeholder="e.g. Vedanta" onkeydown="if(event.key==='Enter')runWatch()" class="inp" style="flex:1;min-width:220px">
  <datalist id="coNames">${CO.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><select id="watchDays" class="inp">${[30,90,180].map(d=>`<option value="${d}" ${W.days===d?'selected':''}>Last ${d} days</option>`).join('')}</select>
  <button class="btn primary" onclick="runWatch()" ${W.busy?'disabled':''}>${W.busy?'Scanning...':'Scan news'}</button><button class="btn s" onclick="demoWatch()">Demo scan</button></div>
  ${W.busy?'<p style="margin-top:14px;color:var(--tm)">Collecting and classifying headlines. This can take up to a minute.</p>':''}</div>
  ${W.err?`<div class="err">${esc(W.err)}</div>`:''}${W.res?watchRes(W.res,'W'):''}`}
function viewIncident(key,n){const r=key==='W'?W.res:S.sd.res,i=r.incidents[n];
  $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card"><div class="k">${esc(i.id)} · ${PILLAR[i.pillar]} · ${esc(i.sub)}</div><h3>Incident timeline</h3>
  ${i.stories.map(s=>{const u=safeUrl(s.url);return`<div style="border-top:1px solid var(--bd);padding:14px 0"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span style="color:var(--tm);font-size:12.5px">${esc(s.date)} · ${esc(s.publisher)} · ${esc(STAGE[s.stage]||s.stage)}</span>${sevTag(s.severity)}</div>
  <p style="margin:6px 0;color:var(--tx)">${esc(s.headline)}</p>${s.summary?`<p>${esc(s.summary)}</p>`:''}${s.rationale?`<p style="font-size:12.5px;color:var(--tm)">${esc(s.rationale)} Confidence ${s.confidence}/100.</p>`:''}
  <div class="fgrid">${FACTOR.map(([k,l,w])=>`<span>${l} <i>×${w}%</i></span><div class="meter" style="margin:0"><div style="--w:${s.factors[k]}%"></div></div><b>${s.factors[k]}</b>`).join('')}</div>
  ${u?`<a class="lnk" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open source article</a>`:''}</div>`}).join('')}
  <p style="font-size:12.5px;color:var(--tm)">Severity = weighted sum of the seven factors × evidence-stage multiplier (allegation 0.80, investigation 0.92, confirmed 1.00, resolved 0.55).</p>
  <button class="btn sm" onclick="closeModal()">Close</button></div></div>`}
/* Say-do check: report disclosures vs news coverage */
async function runSayDo(){const r=S.res;
  if(r.demo){S.sd={busy:false,err:'',res:DEMO_WATCH};render('tab');return}
  S.sd={busy:true,err:'',res:null};render('tab');
  try{S.sd.res=await fetchScan(r.meta.company,90,completedJobId)}catch(e){S.sd.err=e.message}
  S.sd.busy=false;render('tab')}
function sayDoV(r){const sd=S.sd,ok=r.meta.company&&r.meta.company!=='Not identified';
  if(!sd.res)return`<div class="card"><h3>Does the news match the report?</h3><p>Scans recent news about <b>${esc(r.meta.company)}</b> and lines up each controversy against what this report discloses on the related topics.</p><p style="margin-top:14px">${ok?`<button class="btn primary" onclick="runSayDo()" ${sd.busy?'disabled':''}>${sd.busy?'Scanning news...':'Run say-do check'}</button>`:'The company name was not identified in this report, so the news scan cannot run. Use Controversy Watch and enter the name.'}</p>${sd.err?`<div class="err">${esc(sd.err)}</div>`:''}</div>`;
  const x=sd.res,cls={'Disclosure gap':'sev3','Compare claims':'sev2','Not covered':'sev0'};
  return`${riskCards(x)}<div class="tw"><table><thead><tr><th>Assessment</th><th>In the news</th><th>Severity</th><th>In the report</th><th>What to do</th></tr></thead><tbody>${x.say_do.map(d=>`<tr><td><span class="tag ${cls[d.flag]}">${esc(d.flag)}</span></td><td>${esc(d.headline)}<br><span style="color:var(--tm);font-size:12.5px">${esc(d.sub)} · ${esc(STAGE[d.stage]||d.stage)}</span></td><td>${sevTag(d.severity)}</td><td>${d.topics.length?d.topics.map(t=>`${esc(t.topic)}: <b>${esc(t.status)}</b>${t.page?` (p. ${esc(t.page)})`:''}`).join('<br>'):'—'}</td><td>${esc(d.note)}</td></tr>`).join('')||'<tr><td colspan=5>No ESG controversy headlines were found for this company in the last 90 days.</td></tr>'}</tbody></table></div>
  <p style="font-size:13px;color:var(--tm);margin-top:14px">${x.demo?'Synthetic demo data. ':''}This lines up topics; it does not judge whether the report is accurate. An allegation or investigation is not a finding of fault. Full incident detail is under Controversy Watch.</p>`}

/* ---------- Render + motion ---------- */
function countUp(){document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suffix||'',t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e)+suf;p<1&&requestAnimationFrame(f)})(t0)})}
function render(mode){const v=S.view,app=$('#app');
  $('#nav').innerHTML=[['Dashboard','home'],['Analysis','analysis'],['Controversy Watch','watch'],['Methodology','method'],['About','about']].map(([l,k])=>`<button class="${v===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+'<button onclick="showWelcome()">Guide</button>';
  app.className=mode==='page'?'a-page':mode==='tab'?'a-tab':'';
  app.innerHTML={home,analysis,watch,method,about}[v]();
  if(mode){app.querySelectorAll('.reveal,tbody tr').forEach((el,i)=>el.style.setProperty('--i',i));mode==='page'&&countUp()}
  bindDrop()}
function bindDrop(){const d=$('#drop'),fi=$('#fi');if(!d)return;
  const pick=f=>{if(!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){S.err='Only PDF files are supported.';render();return}runAnalysis(f)};
  fi.onchange=()=>pick(fi.files[0]);d.ondragover=e=>{e.preventDefault();d.classList.add('hv')};d.ondragleave=()=>d.classList.remove('hv');d.ondrop=e=>{e.preventDefault();pick(e.dataTransfer.files[0])}}
/* click ripple on buttons */
document.addEventListener('click',e=>{const b=e.target.closest('.btn,.tabs button,nav button');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/2,d=document.createElement('span');
  d.className='ripple';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),650)});
/* ---------- Loading screen + welcome guide ---------- */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function showWelcome(){
  const steps=[['Find or upload a report','Go to <b>Analysis</b>. Pick a well-known company to find its official ESG, sustainability, BRSR or annual report, or drag in any report PDF.'],
    ['Watch the agent work','The pipeline extracts the text, retrieves passages for each ESG topic, asks the AI for metrics with exact quotes, and then checks every quote against the PDF.'],
    ['Review metrics, insights and gaps','Browse the Environmental, Social and Governance tabs. Click <b>View source</b> to see the page a figure came from, and use <b>Gaps</b> to see what the report leaves out.'],
    ['Check the news','Open the <b>Say–Do check</b> tab, or <b>Controversy Watch</b> in the menu, to compare what the company says with what the news reports about it.']];
  $('#welcome').innerHTML=`<div class="welcome" role="dialog" aria-modal="true" aria-labelledby="wTitle"><div class="card">
  <span class="eyebrow">${greeting()}</span><h2 id="wTitle">Welcome to <span>ESG Intelligence</span></h2>
  <p style="color:var(--ts);font-size:15.5px">An AI agent that reads company sustainability reports, checks its own work against the source, and compares the report with news coverage. Here's how to use it:</p>
  <div class="steps">${steps.map((x,i)=>`<div class="step" style="--i:${i}"><div class="n">${i+1}</div><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join('')}</div>
  <p style="font-size:12.5px;color:var(--tm);margin-bottom:18px">No account needed. The first live request can take up to a minute while the server wakes up. The demo works instantly.</p>
  <div class="wfoot"><button class="btn primary" onclick="closeWelcome('analysis')">Start analysing</button><button class="btn" onclick="closeWelcome('demo')">Try the demo</button><button class="btn s" onclick="closeWelcome()">Explore on my own</button>
  <label><input type="checkbox" id="wHide" ${store.get('esg-welcome-hide')?'checked':''}> Don't show again</label></div></div></div>`;
  setTimeout(()=>{const b=document.querySelector('.welcome .btn.primary');b&&b.focus()},50)}
function closeWelcome(next){const c=$('#wHide');
  if(c){if(c.checked)store.set('esg-welcome-hide','1');else try{localStorage.removeItem('esg-welcome-hide')}catch(e){}}
  $('#welcome').innerHTML='';if(next==='analysis')go('analysis');else if(next==='demo')loadDemo()}
(function boot(){const msgs=['Loading the ESG taxonomy…','Preparing the validation agent…','Connecting to the news monitor…','Ready.'];let i=0;
  const t=setInterval(()=>{const m=$('#splashMsg');if(m&&i<msgs.length-1)m.textContent=msgs[++i]},420);
  fetch(API+'/api/health').catch(()=>{}); /* wakes the backend early so the first real request is faster */
  setTimeout(()=>{clearInterval(t);$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),700);if(!store.get('esg-welcome-hide'))showWelcome()},1700)})();
render('page');
